    <path d="M20 3v6h6" fill="none" stroke="#E8EDF2" stroke-width="2" stroke-linejoin="round"/>
    <path d="M11 14h7M11 18h10" fill="none" stroke="#E8EDF2" stroke-width="2" stroke-linecap="round"/>
